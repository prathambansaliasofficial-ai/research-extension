<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paper Popup</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="sheet" id="sheet">
    <header class="meta-row">
      <span class="kicker">DeepTech Recon</span>
      <span class="dot">·</span>
      <span class="kicker" id="tag">loading</span>
    </header>

    <h1 id="title">Fetching a paper…</h1>

    <div id="body" class="body">
      <p class="placeholder">Give it a second — pulling something new from the archive.</p>
    </div>

    <footer class="footer">
      <a id="read-more" class="read-more" href="#" target="_blank" rel="noopener">Read the full write-up →</a>
    </footer>
  </div>

  <button id="shuffle" class="shuffle" title="Get another paper" aria-label="Get another paper">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"></polyline>
      <polyline points="23 20 23 14 17 14"></polyline>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"></path>
    </svg>
  </button>

  <script src="popup.js"></script>
</body>
</html>
